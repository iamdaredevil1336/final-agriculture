<!-- SMART AGRICULTURAL TOOLS QUICK BAR -->
<section class="smart-tools-bar-wrap" aria-label="Smart Agricultural Tools">
  <div class="container">
    <div class="smart-tools-bar">
      <button class="tool-quick-btn" onclick="openCropDoctor()" title="AI Crop Doctor">
        <span class="tool-quick-icon">🌿</span>
        <span class="tool-quick-name">AI Crop Doctor</span>
      </button>
      <button class="tool-quick-btn" onclick="openFertilizerCalculator()" title="Fertilizer Calculator">
        <span class="tool-quick-icon">🌾</span>
        <span class="tool-quick-name">Fertilizer Calc</span>
      </button>
      <button class="tool-quick-btn" onclick="openProfitEstimator()" title="Profit Estimator">
        <span class="tool-quick-icon">📈</span>
        <span class="tool-quick-name">Profit Estimator</span>
      </button>
      <button class="tool-quick-btn" onclick="openMyFarm()" title="My Farm">
        <span class="tool-quick-icon">⭐</span>
        <span class="tool-quick-name">My Farm</span>
      </button>
      <button class="tool-quick-btn" onclick="openSchemesFinder()" title="Kisan Schemes">
        <span class="tool-quick-icon">🏛️</span>
        <span class="tool-quick-name">Kisan Schemes</span>
      </button>
      <button class="tool-quick-btn" onclick="openSoilHealthAnalyzer()" title="Soil Health Analyzer">
        <span class="tool-quick-icon">🧪</span>
        <span class="tool-quick-name">Soil Health</span>
      </button>
      <button class="tool-quick-btn" onclick="openCropComparison()" title="Crop Comparison">
        <span class="tool-quick-icon">⚖️</span>
        <span class="tool-quick-name">Compare</span>
      </button>
      <button class="tool-quick-btn" onclick="openIrrigationPlanner()" title="Smart Irrigation Planner">
        <span class="tool-quick-icon">💧</span>
        <span class="tool-quick-name">Irrigation</span>
      </button>
      <button class="tool-quick-btn" onclick="openMachineryHub()" title="Machinery Hub">
        <span class="tool-quick-icon">🚜</span>
        <span class="tool-quick-name">Machinery Hub</span>
      </button>
    </div>
  </div>
</section>
